<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="25" fill="#172238">CSV files → mesh fingerprints → auditable decisions</text><rect x="35" y="75" width="220" height="115" rx="3" fill="#f2f6fb"/><text x="51" y="103" font-size="13" fill="#172238">INPUT FILES</text><text x="51" y="158" font-size="40" fill="#1257df">3</text><rect x="276" y="75" width="220" height="115" rx="3" fill="#f2f6fb"/><text x="292" y="103" font-size="13" fill="#172238">ROWS</text><text x="292" y="158" font-size="40" fill="#009b83">24</text><rect x="517" y="75" width="220" height="115" rx="3" fill="#f2f6fb"/><text x="533" y="103" font-size="13" fill="#172238">OVERLAP PAIRS</text><text x="533" y="158" font-size="40" fill="#1257df">3</text><rect x="758" y="75" width="220" height="115" rx="3" fill="#f2f6fb"/><text x="774" y="103" font-size="13" fill="#172238">MESH CONFLICTS</text><text x="774" y="158" font-size="40" fill="#e31a35">2</text><text x="35" y="235" font-size="23" fill="#009b83">Source bytes are unchanged</text><text x="35" y="272" font-size="17" fill="#172238">SHA-256 checked before and after audit + explicit-output merge.</text><text x="35" y="318" font-size="17" fill="#172238">Fine/coarse mesh conflicts stay visible; only compatible coarse files are merged.</text><text x="35" y="370" font-size="16" fill="#172238">Synthetic inputs: z = 10 + x + 0.2y; one hole, one repeated row, two mesh steps.</text></g></svg>