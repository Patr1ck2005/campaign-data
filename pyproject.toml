[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-data"
version = "0.1.0"
description = "Schema-neutral audit, deduplication, merge, and split tools for tabular simulation campaigns"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
campaign-data = "campaign_data.__main__:main"
campaign-data-runtime = "campaign_data.runtime:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
